<script>
// ---- src\props.js
/*
 * props.js : the shared doodle props and primitives for photo-doodle films, drawn once here so
 * every shot draws them identically. Loaded after lib.js and before the scenes.
 *
 * Everything is a pure function of its arguments (no state between frames) and every stroke goes
 * through FILM.lib.inkPath, so the boil and the draw-on behave like the rest of the film.
 *
 *   props:       bubble, sparkle, speedLines, starburst, cloud, sun, moon, heart, note, flag,
 *                trail, zzz, dust, drop (see each function's comment)
 *   primitives:  step (stroke i of n from a figure's draw fraction), place (translate/scale/flip),
 *                ink, wash, eye, blush, blob — what src/cast.js builds its characters from
 *
 * The film's own characters live in src/cast.js and call these. Keep them out of scene files: a
 * character redrawn per scene drifts, and sixteen agents will each drift differently.
 *
 * Draw-on: every function takes draw 0..1 and reveals its strokes in order, each stroke taking
 * 1/n of the range with a small overlap, so a figure assembles the way a hand would draw it.
 * Night shots pass night: true, which swaps ink for chalk and drops the pigment.
 */
(function () {
  'use strict';

  const FILM = window.FILM;
  const L = FILM.lib;
  const P = L.pal;
  const TAU = Math.PI * 2;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);

  /** progress of stroke i of n, given the whole-figure draw fraction */
  const step = (d, i, n) => clamp((d * n - i) * 1.35);

  /** rotate + scale helper: maps local coords (x right, y down, origin at the figure's base) */
  function place(ctx, o, fn) {
    ctx.save();
    ctx.translate(o.x, o.y);
    if (o.tilt) ctx.rotate(o.tilt);
    const s = o.s != null ? o.s : 1;
    ctx.scale(o.flip ? -s : s, s);
    fn();
    ctx.restore();
  }

  const inkOf = (o) => (o.night ? P.chalk : P.doodleInk);

  function ink(ctx, pts, o, extra) {
    // o.alpha applies to the whole figure; extra.alpha (per stroke) multiplies it.
    const base = { color: inkOf(o), width: 3.4, wobble: 1.6, tremble: 0.4 };
    const q = Object.assign(base, extra);
    if (o.alpha != null) q.alpha = (q.alpha != null ? q.alpha : 1) * o.alpha;
    L.inkPath(ctx, pts, q);
  }

  function wash(ctx, pts, o, color, extra) {
    if (o.night) return; // night shots are chalk line only, no pigment
    L.wash(ctx, pts, Object.assign({ color, alpha: 0.5, seed: (extra && extra.seed) || 7 }, extra));
  }

  /** a closed blob path: centre, radius, per-angle radius function */
  function blob(cx, cy, n, rf) {
    const pts = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU;
      const r = rf(a, i);
      pts.push([cx + Math.cos(a) * r[0], cy + Math.sin(a) * r[1]]);
    }
    return pts;
  }

  const eye = (ctx, x, y, r, o, blink) => {
    if (blink > 0.5) ink(ctx, [[x - r * 1.3, y], [x + r * 1.3, y]], o, { width: 2.6, smooth: false, taper: 3 });
    else {
      ctx.save();
      ctx.fillStyle = inkOf(o);
      ctx.beginPath();
      ctx.ellipse(x, y, r, r * 1.08, 0, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
  };

  const blush = (ctx, x, y, r, o) => {
    if (o.night) return;
    ctx.save();
    ctx.globalAlpha *= 0.55;
    ctx.fillStyle = P.blush;
    ctx.beginPath();
    ctx.ellipse(x, y, r, r * 0.68, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
  };

  // ---------------------------------------------------------------------------
  // Props
  // ---------------------------------------------------------------------------

  /** bubble(ctx, o) : speech bubble with a tail. x, y is the bubble centre; tail points at tx, ty. */
  function bubble(ctx, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    const w = o.w || 200, h = o.h || 110;
    const pts = blob(o.x, o.y, 34, (a) => [w / 2 + Math.cos(a * 3) * 5, h / 2 + Math.sin(a * 2) * 4]);
    if (!o.night) {
      L.wash(ctx, pts, { color: o.fill || P.washCream, alpha: o.fillAlpha != null ? o.fillAlpha : 0.75, p: d, seed: (o.seed || 5) + 1, offset: [2, 2], edge: 0 });
    }
    ink(ctx, pts, o, { closed: true, draw: d, width: 3, seed: o.seed || 5 });
    if (o.tx != null) {
      const dx = o.tx - o.x, dy = o.ty - o.y;
      const l = Math.hypot(dx, dy) || 1;
      const bx = o.x + (dx / l) * (w / 2) * 0.8, by = o.y + (dy / l) * (h / 2) * 0.9;
      ink(ctx, [[bx - 14, by - 2], [o.tx, o.ty], [bx + 12, by + 8]], o, { draw: d, width: 2.8, seed: (o.seed || 5) + 2 });
    }
    if (o.label && d > 0.85) {
      L.hand(ctx, o.label, o.x, o.y + (o.size || 42) * 0.34, {
        size: o.size || 42,
        align: 'center',
        color: inkOf(o),
        p: clamp((d - 0.85) / 0.15),
      });
    }
  }

  /** sparkle(ctx, x, y, r, o) : a four-point twinkle. */
  function sparkle(ctx, x, y, r, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    if (d <= 0) return;
    const k = r * d;
    ink(ctx, [[x - k, y], [x + k, y]], o, { width: o.width || 2.4, seed: (o.seed || 3) });
    ink(ctx, [[x, y - k], [x, y + k]], o, { width: o.width || 2.4, seed: (o.seed || 3) + 1 });
    ink(ctx, [[x - k * 0.45, y - k * 0.45], [x + k * 0.45, y + k * 0.45]], o, { width: (o.width || 2.4) * 0.7, seed: (o.seed || 3) + 2 });
    ink(ctx, [[x + k * 0.45, y - k * 0.45], [x - k * 0.45, y + k * 0.45]], o, { width: (o.width || 2.4) * 0.7, seed: (o.seed || 3) + 3 });
  }

  /** speedLines(ctx, o) : n trailing lines behind something moving. x, y is the trailing edge. */
  function speedLines(ctx, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    const n = o.n || 3, len = o.len || 90, gap = o.gap || 22, dir = o.dir != null ? o.dir : -1;
    for (let i = 0; i < n; i++) {
      const y = o.y + (i - (n - 1) / 2) * gap;
      const l = len * (i === Math.floor(n / 2) ? 1 : 0.7);
      ink(ctx, [[o.x, y], [o.x + dir * l, y + (i - (n - 1) / 2) * 4]], o, {
        draw: clamp(d * 1.4 - i * 0.12),
        width: o.width || 3,
        seed: (o.seed || 40) + i,
        smooth: false,
      });
    }
  }

  /** starburst(ctx, x, y, r, o) : the impact star behind a loud moment. */
  function starburst(ctx, x, y, r, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    if (d <= 0) return;
    const n = o.n || 10;
    const pts = [];
    for (let i = 0; i < n * 2; i++) {
      const a = (i / (n * 2)) * TAU - Math.PI / 2;
      const rr = (i % 2 ? r * 0.52 : r) * (0.9 + 0.2 * Math.sin(i * 2.7 + (o.seed || 1)));
      pts.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr]);
    }
    if (!o.night && o.fill !== false) L.wash(ctx, pts, { color: o.fill || P.washYellow, alpha: 0.45, p: d, seed: (o.seed || 9) + 4, offset: [3, 2] });
    ink(ctx, pts, o, { closed: true, draw: d, width: o.width || 3.4, seed: o.seed || 9 });
  }

  /** cloud(ctx, x, y, w, o) : a bumpy cloud. o.face: 'angry' | 'happy' draws a face on it. */
  function cloud(ctx, x, y, w, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    const h = o.h || w * 0.46;
    const pts = [];
    const bumps = o.bumps || 5;
    for (let i = 0; i <= 44; i++) {
      const u = i / 44, a = u * TAU;
      const r = 1 + 0.16 * Math.cos(a * bumps + (o.seed || 2));
      pts.push([x + Math.cos(a) * (w / 2) * r, y + Math.sin(a) * (h / 2) * (a > Math.PI ? r : r * 0.82)]);
    }
    if (!o.night) L.wash(ctx, pts, { color: o.fill || P.washBlue, alpha: o.fillAlpha != null ? o.fillAlpha : 0.35, p: d, seed: (o.seed || 2) + 1 });
    ink(ctx, pts, o, { closed: true, draw: d, width: o.width || 3.2, seed: o.seed || 2 });
    if (o.face && d > 0.9) {
      const ey = y - h * 0.05;
      eye(ctx, x - w * 0.12, ey, 4.6, o, o.blink || 0);
      eye(ctx, x + w * 0.12, ey, 4.6, o, o.blink || 0);
      const m = o.face === 'angry'
        ? [[x - w * 0.1, y + h * 0.2], [x, y + h * 0.12], [x + w * 0.1, y + h * 0.2]]
        : [[x - w * 0.1, y + h * 0.12], [x, y + h * 0.24], [x + w * 0.1, y + h * 0.12]];
      ink(ctx, m, o, { width: 2.4, seed: (o.seed || 2) + 6 });
      if (o.face === 'angry') {
        ink(ctx, [[x - w * 0.2, ey - 16], [x - w * 0.06, ey - 8]], o, { width: 2.4, seed: (o.seed || 2) + 7 });
        ink(ctx, [[x + w * 0.2, ey - 16], [x + w * 0.06, ey - 8]], o, { width: 2.4, seed: (o.seed || 2) + 8 });
      }
    }
  }

  /** sun(ctx, x, y, r, o) / moon(ctx, x, y, r, o) : with rays / with a sleepy face. */
  function sun(ctx, x, y, r, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    const disc = blob(x, y, 30, () => [r, r]);
    if (!o.night) L.wash(ctx, disc, { color: o.fill || P.washYellow, alpha: 0.5, p: d, seed: (o.seed || 11) + 1 });
    ink(ctx, disc, o, { closed: true, draw: d, width: 3.2, seed: o.seed || 11 });
    const n = o.rays == null ? 8 : o.rays;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU + (o.rot || 0);
      ink(ctx, [[x + Math.cos(a) * r * 1.25, y + Math.sin(a) * r * 1.25], [x + Math.cos(a) * r * 1.6, y + Math.sin(a) * r * 1.6]], o, {
        draw: clamp(d * 1.3 - i * 0.05),
        width: 2.6,
        seed: (o.seed || 11) + 3 + i,
        smooth: false,
      });
    }
    if (o.face && d > 0.9) {
      eye(ctx, x - r * 0.3, y - r * 0.1, 4.4, o, o.blink || (o.face === 'sleep' ? 1 : 0));
      eye(ctx, x + r * 0.3, y - r * 0.1, 4.4, o, o.blink || (o.face === 'sleep' ? 1 : 0));
      ink(ctx, [[x - r * 0.18, y + r * 0.26], [x, y + r * 0.38], [x + r * 0.18, y + r * 0.26]], o, { width: 2.4, seed: (o.seed || 11) + 20 });
    }
  }

  function moon(ctx, x, y, r, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    const pts = [];
    for (let i = 0; i <= 40; i++) {
      const a = -Math.PI * 0.62 + (i / 40) * Math.PI * 1.24;
      pts.push([x + Math.cos(a) * r, y + Math.sin(a) * r]);
    }
    for (let i = 40; i >= 0; i--) {
      const a = -Math.PI * 0.62 + (i / 40) * Math.PI * 1.24;
      pts.push([x + Math.cos(a) * r * 0.42 + r * 0.42, y + Math.sin(a) * r * 0.92]);
    }
    if (!o.night) L.wash(ctx, pts, { color: o.fill || P.washCream, alpha: 0.5, p: d, seed: (o.seed || 13) + 1 });
    ink(ctx, pts, o, { closed: true, draw: d, width: 3.2, seed: o.seed || 13 });
    if (o.face && d > 0.9) {
      eye(ctx, x - r * 0.28, y - r * 0.08, 4.2, o, 1);
      ink(ctx, [[x - r * 0.34, y + r * 0.3], [x - r * 0.18, y + r * 0.4], [x - r * 0.02, y + r * 0.3]], o, { width: 2.2, seed: (o.seed || 13) + 6 });
    }
  }

  /** heart(ctx, x, y, r, o) and note(ctx, x, y, s, o) : the two little feeling glyphs. */
  function heart(ctx, x, y, r, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    const pts = [];
    for (let i = 0; i <= 48; i++) {
      const a = (i / 48) * TAU;
      const sx = 16 * Math.pow(Math.sin(a), 3);
      const sy = 13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a);
      pts.push([x + (sx / 16) * r, y - (sy / 16) * r]);
    }
    if (!o.night) L.wash(ctx, pts, { color: o.fill || P.washPink, alpha: 0.55, p: d, seed: (o.seed || 17) + 1 });
    ink(ctx, pts, o, { closed: true, draw: d, width: o.width || 2.8, seed: o.seed || 17 });
  }

  function note(ctx, x, y, s = 1, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    const head = blob(x, y, 20, () => [11 * s, 8.5 * s]);
    if (!o.night) L.wash(ctx, head, { color: o.fill || P.washLilac, alpha: 0.55, p: d, seed: (o.seed || 19) + 1 });
    ink(ctx, head, o, { closed: true, draw: d, width: 2.6, seed: o.seed || 19 });
    ink(ctx, [[x + 10 * s, y - 2 * s], [x + 11 * s, y - 40 * s]], o, { draw: d, width: 2.6, seed: (o.seed || 19) + 2 });
    if (o.flag !== false) ink(ctx, [[x + 11 * s, y - 40 * s], [x + 26 * s, y - 30 * s], [x + 22 * s, y - 18 * s]], o, { draw: d, width: 2.4, seed: (o.seed || 19) + 3 });
  }

  /** flag(ctx, x, y, o) : a little pennant on a pole, y is the pole's foot. */
  function flag(ctx, x, y, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    const h = o.h || 90;
    ink(ctx, [[x, y], [x - 2, y - h]], o, { draw: step(d, 0, 2), width: 3, seed: o.seed || 23 });
    const w = o.w || 62, wave = o.wave || 0;
    const pts = [
      [x - 2, y - h], [x + w * 0.5, y - h + 6 + wave], [x + w, y - h + 2 - wave],
      [x + w * 0.6, y - h + 30 + wave], [x - 2, y - h + 34],
    ];
    if (!o.night) L.wash(ctx, pts, { color: o.fill || P.washRed, alpha: 0.5, p: step(d, 1, 2), seed: (o.seed || 23) + 1 });
    ink(ctx, pts, o, { closed: true, draw: step(d, 1, 2), width: 2.8, seed: (o.seed || 23) + 2 });
  }

  /** trail(ctx, pts, o) : a travelling character's trail — a double line with sparkles along it. */
  function trail(ctx, pts, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    if (d <= 0 || !pts || pts.length < 2) return;
    ink(ctx, pts, o, { draw: d, width: o.width || 2.6, seed: o.seed || 29, alpha: o.alpha != null ? o.alpha : 0.75 });
    const off = pts.map(([x, y]) => [x, y + (o.gap || 9)]);
    ink(ctx, off, o, { draw: clamp(d * 1.1 - 0.08), width: (o.width || 2.6) * 0.8, seed: (o.seed || 29) + 1, alpha: (o.alpha != null ? o.alpha : 0.75) * 0.8 });
    const n = o.sparkles == null ? 3 : o.sparkles;
    for (let i = 0; i < n; i++) {
      const u = (i + 0.5) / n;
      if (d < u) continue;
      const k = Math.min(pts.length - 1, Math.floor(u * (pts.length - 1)));
      sparkle(ctx, pts[k][0], pts[k][1] - 14, 9, { seed: (o.seed || 29) + 5 + i, night: o.night, width: 1.8 });
    }
  }

  /** zzz(ctx, o) : three sleeping z's rising. */
  function zzz(ctx, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    const s = o.s || 1;
    for (let i = 0; i < 3; i++) {
      const p = clamp(d * 3 - i);
      if (p <= 0) continue;
      const k = (26 - i * 6) * s;
      const x = o.x + i * 26 * s, y = o.y - i * 34 * s;
      ink(ctx, [[x, y], [x + k, y], [x, y + k], [x + k, y + k]], o, { draw: p, width: 2.6, smooth: false, seed: (o.seed || 31) + i });
    }
  }

  /** dust(ctx, x, y, o) : a puff of motion dust at the ground. */
  function dust(ctx, x, y, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    const n = o.n || 3;
    for (let i = 0; i < n; i++) {
      const a = Math.PI + (i / (n - 1 || 1)) * Math.PI;
      const r = (o.r || 18) * (0.7 + 0.3 * Math.cos(i * 2.1));
      cloud(ctx, x + Math.cos(a) * (o.spread || 34), y + Math.sin(a) * 10, r * 2, {
        draw: clamp(d * 1.3 - i * 0.1),
        night: o.night,
        seed: (o.seed || 37) + i,
        fill: o.fill || P.washCream,
        fillAlpha: 0.3,
        width: 2.4,
      });
    }
  }

  /** drop(ctx, x, y, r, o) : a raindrop / teardrop, point up. */
  function drop(ctx, x, y, r, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    const pts = [];
    for (let i = 0; i <= 30; i++) {
      const a = (i / 30) * TAU - Math.PI / 2;
      const rr = r * (1 - 0.45 * Math.cos(a)) * (a > Math.PI * 0.5 && a < Math.PI * 1.5 ? 1 : 1);
      pts.push([x + Math.cos(a) * rr * 0.72, y + Math.sin(a) * rr]);
    }
    if (!o.night) L.wash(ctx, pts, { color: o.fill || P.washBlue, alpha: 0.5, p: d, seed: (o.seed || 41) + 1 });
    ink(ctx, pts, o, { closed: true, draw: d, width: o.width || 2.4, seed: o.seed || 41 });
  }

  FILM.props = {
    bubble,
    sparkle,
    speedLines,
    starburst,
    cloud,
    sun,
    moon,
    heart,
    note,
    flag,
    trail,
    zzz,
    dust,
    drop,
    // primitives, for src/cast.js
    step,
    place,
    ink,
    wash,
    eye,
    blush,
    blob,
    inkOf,
  };
})();

</script>
<script>
// ---- src\cast.js
/*
 * cast.js : las piezas que se repiten en los videos del taller ("Qué vamos a armar", "Cómo se aprueba AE4"),
 * dibujadas una sola vez acá para que todas las tomas las muestren iguales. Se carga después de lib.js y props.js, antes de las escenas.
 *
 *   caption   el rótulo de la toma (abajo, centrado)
 *   tag       etiqueta tipo sticker (Evolution, n8n, Odoo)
 *   phone     un celular; devuelve la pantalla en coordenadas del mundo
 *   bubble    globo de chat con una o dos líneas
 *   server    caja de servidor con ranuras y luz
 *   brick     ladrillo de LEGO con texto
 *   notebook  cuaderno abierto con renglones
 *   remote    control remoto (Dokploy)
 *   arrow     flecha dibujada a mano
 *   tableTop, tableLeg, mantel   la mesa de AE4 (G1) y su mantel cuadriculado
 *   calendar  hoja de almanaque
 *   person    un integrante de la pareja, de medio cuerpo
 *   laptop    notebook abierta vista de frente
 *
 * Todo es función pura de sus argumentos. Cada figura acepta { x, y, s, draw, seed, schem }:
 * schem: true la dibuja en contorno lavanda para el plano azul, sin rellenos.
 */
(function () {
  'use strict';

  const FILM = window.FILM;
  const L = FILM.lib;
  const P = L.pal;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const FONT = '"SF Pro Rounded", ui-rounded, "Helvetica Neue", system-ui, -apple-system, "Segoe UI", Arial, sans-serif';

  /** progreso del trazo i de n dado el progreso de la figura */
  const step = (d, i, n) => clamp((d * n - i) * 1.35);

  function local(ctx, o, fn) {
    ctx.save();
    ctx.translate(o.x || 0, o.y || 0);
    const s = o.s != null ? o.s : 1;
    if (o.rot) ctx.rotate(o.rot);
    if (s !== 1) ctx.scale(s, s);
    const out = fn();
    ctx.restore();
    return out;
  }

  function line(ctx, o) {
    return o.schem ? P.lavender : P.ink;
  }

  /** un trazo de tinta (o de lavanda en el plano azul) */
  function ink(ctx, pts, o, extra) {
    const q = Object.assign({ color: line(ctx, o), width: 4, wobble: 1.4, tremble: 0.35 }, extra);
    if (o.schem) {
      delete q.fill;
      q.width = Math.min(q.width, 3);
    }
    if (o.alpha != null) q.alpha = (q.alpha != null ? q.alpha : 1) * o.alpha;
    L.inkPath(ctx, pts, q);
  }

  function measure(ctx, str, size, weight) {
    ctx.save();
    ctx.font = `${weight} ${size}px ${FONT}`;
    const w = ctx.measureText(str).width;
    ctx.restore();
    return w;
  }

  // ---------------------------------------------------------------------------
  // Texto
  // ---------------------------------------------------------------------------

  /**
   * caption(ctx, str, p, o) : el rótulo de la toma. p 0..1 revela el texto (typewriter).
   *   o.schem true = plano azul (texto claro sobre banda oscura)
   */
  function caption(ctx, str, p, o = {}) {
    if (p <= 0) return;
    const size = o.size || 54;
    const y = o.y || 975;
    const w = measure(ctx, str, size, 600);
    const padX = 40, top = y - size * 0.98, bot = y + size * 0.36;
    ctx.save();
    ctx.globalAlpha *= clamp(p * 3);
    ctx.fillStyle = o.schem ? L.rgba(P.navyDeep, 0.78) : L.rgba(P.white, 0.82);
    const x0 = 960 - w / 2 - padX, x1 = 960 + w / 2 + padX;
    const r = (bot - top) / 2;
    ctx.beginPath();
    ctx.moveTo(x0 + r, top);
    ctx.lineTo(x1 - r, top);
    ctx.arc(x1 - r, top + r, r, -Math.PI / 2, Math.PI / 2);
    ctx.lineTo(x0 + r, bot);
    ctx.arc(x0 + r, top + r, r, Math.PI / 2, Math.PI * 1.5);
    ctx.fill();
    ctx.restore();
    L.text(ctx, str, 960, y, { size, weight: 600, align: 'center', color: o.schem ? P.lineWhite : P.ink, p: clamp(p) });
  }

  /**
   * tag(ctx, str, x, y, o) : etiqueta sticker centrada en (x, y). o.pop 0..1 escala de entrada.
   *   size 46, fill P.white, color P.ink, seed
   */
  function tag(ctx, str, x, y, o = {}) {
    const pop = o.pop == null ? 1 : o.pop;
    if (pop <= 0) return;
    const size = o.size || 46;
    const w = measure(ctx, str, size, 700) + 56;
    const h = size * 1.55;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(pop, pop);
    if (o.rot) ctx.rotate(o.rot);
    const box = L.rrectPts(-w / 2, -h / 2, w, h, h * 0.3, 18);
    if (o.schem) {
      L.inkPath(ctx, box, { closed: true, color: P.lavender, width: 2.6, fill: P.navy, seed: o.seed || 5 });
    } else {
      L.inkPath(ctx, box, { closed: true, color: P.ink, width: 4, fill: o.fill || P.white, seed: o.seed || 5 });
    }
    L.text(ctx, str, 0, size * 0.36, { size, weight: 700, align: 'center', color: o.schem ? P.lineWhite : o.color || P.ink });
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // Celular
  // ---------------------------------------------------------------------------

  /**
   * phone(ctx, o) : celular centrado en (x, y), alto h (750 por defecto, G2).
   *   screenColor P.screen, draw 0..1, schem, seed
   * Devuelve { x0, y0, x1, y1 } de la pantalla en coordenadas del mundo (sin rot).
   */
  function phone(ctx, o = {}) {
    const h = o.h || 750;
    const w = h * (400 / 750);
    const d = o.draw == null ? 1 : clamp(o.draw);
    const sd = o.seed || 11;
    const x = o.x || 0, y = o.y || 0;
    const sx0 = -w / 2 + w * 0.06, sx1 = w / 2 - w * 0.06;
    const sy0 = -h / 2 + h * 0.107, sy1 = h / 2 - h * 0.107;
    ctx.save();
    ctx.translate(x, y);
    if (o.rot) ctx.rotate(o.rot);
    const body = L.rrectPts(-w / 2, -h / 2, w, h, w * 0.135, 20);
    if (!o.schem && d >= 1) {
      // sombra
      ctx.save();
      ctx.globalAlpha *= 0.18;
      ctx.fillStyle = P.ink;
      ctx.beginPath();
      ctx.ellipse(12, h / 2 + 18, w * 0.55, 16, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    ink(ctx, body, o, { closed: true, width: 5, fill: P.phoneCase, seed: sd, draw: step(d, 0, 3) });
    const scr = L.rrectPts(sx0, sy0, sx1 - sx0, sy1 - sy0, 10, 20);
    ink(ctx, scr, o, { closed: true, width: 3, fill: o.screenColor || P.screen, seed: sd + 1, draw: step(d, 1, 3) });
    // parlante y botón
    ink(ctx, [[-w * 0.12, -h / 2 + h * 0.055], [w * 0.12, -h / 2 + h * 0.055]], o, {
      width: 5, color: o.schem ? P.lavender : P.inkFaint, seed: sd + 2, draw: step(d, 2, 3),
    });
    L.inkCircle(ctx, 0, h / 2 - h * 0.054, h * 0.024, {
      color: o.schem ? P.lavender : P.inkFaint, width: 3, seed: sd + 3, draw: step(d, 2, 3),
    });
    if (!o.schem && o.header !== false && d >= 1) {
      // barra del chat: avatar y nombre
      ctx.save();
      ctx.fillStyle = P.chatGreen;
      ctx.fillRect(sx0 + 2, sy0 + 2, sx1 - sx0 - 4, h * 0.085);
      ctx.restore();
      ctx.save();
      ctx.fillStyle = P.white;
      ctx.beginPath();
      ctx.arc(sx0 + 44, sy0 + h * 0.044, h * 0.026, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      L.text(ctx, o.title || 'Empanadas Doña Rosa', sx0 + 80, sy0 + h * 0.058, { size: h * 0.032, weight: 600, color: P.white });
    }
    ctx.restore();
    return { x0: x + sx0, y0: y + sy0, x1: x + sx1, y1: y + sy1, top: y + sy0 + h * 0.085 };
  }

  /**
   * bubble(ctx, o) : globo de chat. o.side 'right' (cliente) | 'left' (respuesta).
   *   x, y (esquina superior del lado del que sale), w, lines [str], size 30, fill, pop 0..1, ticks 0..1
   */
  function bubble(ctx, o = {}) {
    const pop = o.pop == null ? 1 : o.pop;
    if (pop <= 0) return;
    const lines = o.lines || [''];
    const size = o.size || 30;
    const w = o.w || 300;
    const h = lines.length * size * 1.3 + size * 1.2;
    const right = o.side !== 'left';
    const x0 = right ? o.x - w : o.x;
    ctx.save();
    ctx.translate(right ? o.x : o.x, o.y);
    ctx.scale(pop, pop);
    ctx.translate(right ? -o.x : -o.x, -o.y);
    const pts = L.rrectPts(x0, o.y, w, h, 18, 16);
    L.inkPath(ctx, pts, { closed: true, color: P.ink, width: 3, fill: o.fill || (right ? P.bubbleOut : P.bubbleIn), seed: o.seed || 21 });
    // colita
    const tx = right ? o.x : o.x;
    const tail = right ? [[tx - 6, o.y + 8], [tx + 18, o.y + 2], [tx - 4, o.y + 28]] : [[tx + 6, o.y + 8], [tx - 18, o.y + 2], [tx + 4, o.y + 28]];
    L.inkPath(ctx, tail, { closed: true, color: P.ink, width: 2.6, fill: o.fill || (right ? P.bubbleOut : P.bubbleIn), seed: (o.seed || 21) + 1, smooth: false });
    lines.forEach((s, i) => L.text(ctx, s, x0 + 22, o.y + size * 1.15 + i * size * 1.3, { size, weight: 500, color: P.ink }));
    if (o.ticks) {
      const k = clamp(o.ticks);
      const bx = x0 + w - 64, by = o.y + h - 16;
      ctx.save();
      ctx.globalAlpha *= k;
      for (const dx of [0, 14]) {
        L.inkPath(ctx, [[bx + dx, by - 9], [bx + dx + 7, by - 2], [bx + dx + 20, by - 18]], { color: P.tickBlue, width: 3, smooth: false, seed: 40 + dx });
      }
      ctx.restore();
    }
    ctx.restore();
    return { x0, y0: o.y, x1: x0 + w, y1: o.y + h };
  }

  // ---------------------------------------------------------------------------
  // Servidor, ladrillo, cuaderno, control remoto, flecha
  // ---------------------------------------------------------------------------

  /**
   * server(ctx, o) : caja de servidor centrada en (x, y), w × h (por defecto 420 × 560).
   *   led 0..1 (brillo de la luz verde), window true deja una ventana arriba para meter algo adentro
   * Devuelve { x0, y0, x1, y1, win: {x0,y0,x1,y1}|null, led: [x, y] }
   */
  function server(ctx, o = {}) {
    const w = o.w || 420, h = o.h || 560;
    const x = o.x || 0, y = o.y || 0;
    const d = o.draw == null ? 1 : clamp(o.draw);
    const sd = o.seed || 61;
    const x0 = x - w / 2, y0 = y - h / 2;
    ink(ctx, L.rrectPts(x0, y0, w, h, 22, 20), o, { closed: true, width: 5, fill: P.serverGrey, seed: sd, draw: step(d, 0, 3) });
    let win = null;
    const slotTop = o.window ? y0 + h * 0.62 : y0 + h * 0.18;
    if (o.window) {
      win = { x0: x0 + w * 0.08, y0: y0 + h * 0.06, x1: x0 + w * 0.92, y1: y0 + h * 0.56 };
      ink(ctx, L.rrectPts(win.x0, win.y0, win.x1 - win.x0, win.y1 - win.y0, 12, 20), o, {
        closed: true, width: 3, fill: P.paperShade, seed: sd + 1, draw: step(d, 1, 3),
      });
    }
    const n = o.window ? 3 : 5;
    for (let i = 0; i < n; i++) {
      const yy = slotTop + i * 46;
      ink(ctx, [[x0 + w * 0.12, yy], [x0 + w * 0.62, yy]], o, {
        width: 6, color: o.schem ? P.lavender : P.serverDeep, seed: sd + 4 + i, draw: step(d, 2, 3),
      });
    }
    const led = [x0 + w * 0.82, slotTop];
    if (d >= 1) {
      const k = o.led == null ? 1 : o.led;
      if (o.schem) {
        L.glowDot(ctx, led[0], led[1], 9, { color: P.schemGreen, core: P.schemGreen, rays: 0, intensity: 0.5 + 0.5 * k });
      } else {
        ctx.save();
        ctx.fillStyle = L.mix(P.serverDeep, '#7BE07F', k);
        ctx.beginPath();
        ctx.arc(led[0], led[1], 13, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha *= 0.35 * k;
        ctx.beginPath();
        ctx.arc(led[0], led[1], 28, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        L.inkCircle(ctx, led[0], led[1], 13, { width: 2.4, seed: sd + 9 });
      }
    }
    return { x0, y0, x1: x0 + w, y1: y0 + h, win, led };
  }

  /**
   * brick(ctx, o) : ladrillo de LEGO centrado en (x, y), 320 × 150 (G1).
   *   color, lines [str] (texto blanco, 40 px), pop 0..1 (escala), schem
   */
  function brick(ctx, o = {}) {
    const pop = o.pop == null ? 1 : o.pop;
    if (pop <= 0) return;
    const w = o.w || 320, h = o.h || 150;
    const sd = o.seed || 81;
    ctx.save();
    ctx.translate(o.x || 0, o.y || 0);
    ctx.scale(pop, pop);
    const col = o.color || P.legoRed;
    const stud = w * 0.16, studH = 22;
    for (let i = 0; i < 3; i++) {
      const cx = -w / 2 + w * (0.2 + i * 0.3);
      const pts = L.rrectPts(cx - stud / 2, -h / 2 - studH, stud, studH + 6, 6, 10);
      ink(ctx, pts, o, { closed: true, width: 3.4, fill: col, seed: sd + i });
    }
    const body = L.rrectPts(-w / 2, -h / 2, w, h, 12, 20);
    ink(ctx, body, o, { closed: true, width: 4.4, fill: col, seed: sd + 5 });
    if (!o.schem) {
      // sombra inferior dentro del ladrillo
      L.hatch(ctx, L.rectPts(-w / 2 + 8, h / 2 - 26, w - 16, 20, 20), { spacing: 6, width: 1.4, color: P.ink, alpha: 0.35, seed: sd + 6, length: [10, 30] });
    }
    const lines = o.lines || [];
    const size = o.size || 40;
    const y0 = -((lines.length - 1) * size * 1.12) / 2 + size * 0.36;
    lines.forEach((s, i) => L.text(ctx, s, 0, y0 + i * size * 1.12, { size, weight: 700, align: 'center', color: o.schem ? P.lineWhite : o.textColor || P.white }));
    ctx.restore();
  }

  /**
   * notebook(ctx, o) : cuaderno abierto centrado en (x, y), w × h (1000 × 670).
   * Devuelve { left: {x0,y0,x1,y1}, right: {...}, rows: [y...] } (renglones de la página derecha y la izquierda).
   */
  function notebook(ctx, o = {}) {
    const w = o.w || 1000, h = o.h || 670;
    const x = o.x || 0, y = o.y || 0;
    const sd = o.seed || 101;
    const x0 = x - w / 2, y0 = y - h / 2;
    // tapa
    ink(ctx, L.rrectPts(x0 - 22, y0 - 16, w + 44, h + 40, 18, 20), o, { closed: true, width: 4.4, fill: P.odooPlum, seed: sd });
    // páginas
    const gap = 14;
    const left = { x0, y0, x1: x - gap, y1: y0 + h };
    const right = { x0: x + gap, y0, x1: x0 + w, y1: y0 + h };
    for (const [k, pg] of [[1, left], [2, right]]) {
      ink(ctx, L.rrectPts(pg.x0, pg.y0, pg.x1 - pg.x0, pg.y1 - pg.y0, 10, 20), o, { closed: true, width: 3.2, fill: P.white, seed: sd + k });
    }
    const rows = [];
    ctx.save();
    ctx.strokeStyle = o.schem ? P.lavender : P.pageLine;
    ctx.lineWidth = 2;
    ctx.globalAlpha *= 0.8;
    for (let r = 0; r < 9; r++) {
      const yy = y0 + 120 + r * 62;
      if (yy > y0 + h - 20) break;
      rows.push(yy);
      ctx.beginPath();
      ctx.moveTo(left.x0 + 30, yy);
      ctx.lineTo(left.x1 - 20, yy);
      ctx.moveTo(right.x0 + 20, yy);
      ctx.lineTo(right.x1 - 30, yy);
      ctx.stroke();
    }
    ctx.restore();
    // espiral del lomo
    for (let r = 0; r < 9; r++) {
      const yy = y0 + 40 + r * ((h - 80) / 8);
      L.inkCircle(ctx, x, yy, 12, { width: 3, color: line(ctx, o), seed: sd + 20 + r });
    }
    return { left, right, rows };
  }

  /** remote(ctx, o) : control remoto vertical centrado en (x, y), alto 260 a s 1. */
  function remote(ctx, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    return local(ctx, o, () => {
      const sd = o.seed || 131;
      ink(ctx, L.rrectPts(-55, -130, 110, 260, 40, 16), o, { closed: true, width: 4, fill: P.phoneCase, seed: sd, draw: step(d, 0, 2) });
      if (d < 1) return;
      const cols = o.schem ? [P.lavender, P.lavender, P.lavender] : [P.legoRed, P.legoYellow, P.legoGreen];
      [[0, -70, 22], [-22, -5, 15], [22, -5, 15], [0, 50, 15]].forEach(([bx, by, r], i) => {
        L.inkCircle(ctx, bx, by, r, { width: o.schem ? 2.4 : 3, color: line(ctx, o), fill: o.schem ? null : cols[i % 3], seed: sd + 1 + i });
      });
    });
  }

  /**
   * arrow(ctx, x1, y1, x2, y2, o) : flecha de tinta con punta. o.p 0..1 dibuja de x1 a x2.
   *   color, width 5, bend 0 (px, curva hacia la normal), seed
   */
  function arrow(ctx, x1, y1, x2, y2, o = {}) {
    const p = o.p == null ? 1 : clamp(o.p);
    if (p <= 0) return;
    const bend = o.bend || 0;
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len, ny = dx / len;
    const pts = [];
    for (let i = 0; i <= 24; i++) {
      const u = i / 24;
      const bx = (1 - u) * (1 - u) * x1 + 2 * u * (1 - u) * (mx + nx * bend) + u * u * x2;
      const by = (1 - u) * (1 - u) * y1 + 2 * u * (1 - u) * (my + ny * bend) + u * u * y2;
      pts.push([bx, by]);
    }
    const color = o.color || (o.schem ? P.lavender : P.ink);
    const width = o.width || (o.schem ? 3 : 5);
    L.inkPath(ctx, pts, { color, width, draw: p, seed: o.seed || 151, taper: [6, 2] });
    if (p >= 0.98) {
      const [ax, ay] = pts[24], [bx, by] = pts[21];
      const a = Math.atan2(ay - by, ax - bx);
      const hl = o.head || 26;
      L.inkPath(ctx, [[ax - Math.cos(a - 0.5) * hl, ay - Math.sin(a - 0.5) * hl], [ax, ay], [ax - Math.cos(a + 0.5) * hl, ay - Math.sin(a + 0.5) * hl]], {
        color, width, smooth: false, seed: (o.seed || 151) + 1, taper: [4, 4],
      });
    }
  }

  // ---------------------------------------------------------------------------
  // Piezas de "Cómo se aprueba AE4": la mesa, el mantel, el almanaque, la persona, la notebook
  // ---------------------------------------------------------------------------

  /**
   * tableTop(ctx, o) : la tabla de la mesa, centrada en (x, y), w × h (1240 × 56, G1).
   *   fill P.wood, schem, draw 0..1, seed
   */
  function tableTop(ctx, o = {}) {
    const w = o.w || 1240, h = o.h || 56;
    const x = o.x || 0, y = o.y || 0;
    const d = o.draw == null ? 1 : clamp(o.draw);
    const sd = o.seed || 201;
    const x0 = x - w / 2, y0 = y - h / 2;
    ink(ctx, L.rrectPts(x0, y0, w, h, 12, 24), o, { closed: true, width: 5, fill: o.fill || P.wood, seed: sd, draw: d });
    if (d < 1) return;
    // vetas de la madera
    for (let i = 0; i < 3; i++) {
      const yy = y0 + h * (0.3 + i * 0.22);
      const a = x0 + w * (0.04 + ((i * 0.37) % 0.3)), b = a + w * (0.2 + i * 0.07);
      ink(ctx, [[a, yy], [(a + b) / 2, yy + 3], [b, yy]], o, {
        width: 2, color: o.schem ? P.lavender : P.inkSoft, alpha: o.schem ? 0.45 : 0.55, seed: sd + 3 + i,
      });
    }
  }

  /**
   * tableLeg(ctx, o) : una pata de la mesa centrada en x, de y0 a y1, ancho w (70).
   *   fill (color de la pata), schem, draw 0..1, seed
   */
  function tableLeg(ctx, o = {}) {
    const w = o.w || 70;
    const x = o.x || 0, y0 = o.y0 || 0, y1 = o.y1 || 300;
    const d = o.draw == null ? 1 : clamp(o.draw);
    const tw = w * 0.82;
    const pts = [[x - w / 2, y0], [x + w / 2, y0], [x + tw / 2, y1], [x - tw / 2, y1]];
    ink(ctx, pts, o, { closed: true, width: 4.4, fill: o.fill || P.wood, seed: o.seed || 211, smooth: false, draw: d });
  }

  /**
   * mantel(ctx, o) : mantel cuadriculado apoyado en una tabla cuya cara de arriba está en y.
   *   x (centro), y, w (ancho del mantel), drop (cuánto cuelga adelante, 150), schem, seed, alpha
   * Devuelve { x0, x1, y0, y1 } de la cara que cuelga.
   */
  function mantel(ctx, o = {}) {
    const w = o.w || 1300, drop = o.drop || 150;
    const x = o.x || 0, y = o.y || 0;
    const sd = o.seed || 221;
    const x0 = x - w / 2, x1 = x + w / 2, y0 = y - 6, y1 = y + drop;
    const pts = [];
    for (let i = 0; i <= 12; i++) pts.push([x0 + 10 + ((w - 20) * i) / 12, y0]);
    for (let i = 1; i <= 6; i++) pts.push([x1 - 10 + (24 * i) / 6, y0 + ((y1 - 14 - y0) * i) / 6]);
    const n = 90, waves = 5.5;
    for (let i = 0; i <= n; i++) {
      const u = i / n;
      pts.push([x1 + 14 - (w + 28) * u, y1 - 14 + 14 * Math.cos(u * waves * Math.PI * 2)]);
    }
    for (let i = 5; i >= 1; i--) pts.push([x0 + 10 - (24 * i) / 6, y0 + ((y1 - 14 - y0) * i) / 6]);
    ctx.save();
    if (o.alpha != null) ctx.globalAlpha *= o.alpha;
    if (o.schem) {
      L.inkPath(ctx, pts, { closed: true, color: P.lineWhite, width: 3, fill: P.navyLight, seed: sd });
    } else {
      L.inkPath(ctx, pts, { closed: true, color: P.ink, width: 4, fill: P.white, seed: sd });
    }
    // cuadrillé: rectángulos alternados, recortados a la forma del mantel
    ctx.save();
    ctx.beginPath();
    pts.forEach(([px, py], i) => (i ? ctx.lineTo(px, py) : ctx.moveTo(px, py)));
    ctx.closePath();
    ctx.clip();
    const cell = 46;
    ctx.fillStyle = o.schem ? L.rgba(P.lavender, 0.28) : L.rgba(P.red, 0.78);
    for (let r = 0; r * cell < drop + 20; r++) {
      for (let c = 0; c * cell < w + 40; c++) {
        if ((r + c) % 2) continue;
        ctx.fillRect(x0 - 20 + c * cell, y0 + r * cell, cell, cell);
      }
    }
    ctx.restore();
    if (!o.schem) L.inkPath(ctx, pts, { closed: true, color: P.ink, width: 4, seed: sd });
    ctx.restore();
    return { x0, x1, y0, y1 };
  }

  /**
   * calendar(ctx, o) : hoja de almanaque centrada en (x, y), w × h (440 × 520 a s 1).
   *   day '19', weekday 'JUEVES', month 'NOVIEMBRE', schem, seed, s, bare (solo el número: para íconos chicos)
   */
  function calendar(ctx, o = {}) {
    return local(ctx, o, () => {
      const w = 440, h = 520, sd = o.seed || 231;
      const x0 = -w / 2, y0 = -h / 2;
      ink(ctx, L.rrectPts(x0, y0, w, h, 22, 22), o, { closed: true, width: 5, fill: P.white, seed: sd });
      const band = 110;
      if (!o.schem) {
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(x0 + 4, y0 + band);
        ctx.lineTo(x0 + 4, y0 + 22);
        ctx.quadraticCurveTo(x0 + 4, y0 + 4, x0 + 22, y0 + 4);
        ctx.lineTo(x0 + w - 22, y0 + 4);
        ctx.quadraticCurveTo(x0 + w - 4, y0 + 4, x0 + w - 4, y0 + 22);
        ctx.lineTo(x0 + w - 4, y0 + band);
        ctx.closePath();
        ctx.fillStyle = P.legoRed;
        ctx.fill();
        ctx.restore();
      }
      ink(ctx, [[x0 + 6, y0 + band], [x0 + w - 6, y0 + band]], o, { width: 4, seed: sd + 1 });
      // anillas
      for (const ax of [-110, 110]) {
        L.inkCircle(ctx, ax, y0 + 4, 16, { width: 4, color: line(ctx, o), fill: o.schem ? null : P.serverGrey, seed: sd + 2 + ax });
      }
      if (o.bare) {
        L.text(ctx, o.day || '19', 0, y0 + h - 70, { size: 250, weight: 800, align: 'center', color: o.schem ? P.lineWhite : P.ink });
        return;
      }
      L.text(ctx, o.month || 'NOVIEMBRE', 0, y0 + 80, { size: 50, weight: 800, align: 'center', color: o.schem ? P.lineWhite : P.white, tracking: 2 });
      L.text(ctx, o.weekday || 'JUEVES', 0, y0 + band + 78, { size: 56, weight: 700, align: 'center', color: o.schem ? P.lavender : P.inkSoft, tracking: 3 });
      L.text(ctx, o.day || '19', 0, y0 + h - 70, { size: 250, weight: 800, align: 'center', color: o.schem ? P.lineWhite : P.ink });
    });
  }

  /**
   * person(ctx, o) : un integrante de la pareja, de medio cuerpo; (x, y) es el centro de los hombros.
   *   s, shirt (color), hair (color), schem, seed, flip (mira hacia la izquierda)
   */
  function person(ctx, o = {}) {
    return local(ctx, o, () => {
      const sd = o.seed || 241;
      const body = [[-150, 170], [-140, 40], [-110, -30], [-50, -55], [50, -55], [110, -30], [140, 40], [150, 170]];
      ink(ctx, body, o, { closed: true, width: 5, fill: o.shirt || P.teal, seed: sd });
      // cuello
      ink(ctx, [[-26, -55], [-22, -82], [22, -82], [26, -55]], o, { width: 4, fill: P.duskRose, seed: sd + 1 });
      // cabeza y pelo
      L.inkCircle(ctx, 0, -160, 82, { width: 5, color: line(ctx, o), fill: o.schem ? P.navy : P.duskRose, seed: sd + 2 });
      const hair = [];
      for (let i = 0; i <= 16; i++) {
        const a = Math.PI + (i / 16) * Math.PI;
        hair.push([Math.cos(a) * 88, -165 + Math.sin(a) * 86]);
      }
      hair.push([70, -180], [20, -195], [-40, -185], [-82, -150]);
      ink(ctx, hair, o, { closed: true, width: 4, fill: o.hair || P.inkSoft, seed: sd + 3 });
      // ojos y sonrisa
      const eye = o.schem ? P.lineWhite : P.ink;
      for (const ex of [-28, 28]) {
        ctx.save();
        ctx.fillStyle = eye;
        ctx.beginPath();
        ctx.arc(ex, -150, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      ink(ctx, [[-28, -115], [0, -102], [28, -115]], o, { width: 4, seed: sd + 4 });
    });
  }

  /**
   * laptop(ctx, o) : notebook abierta vista de frente, centrada en (x, y) = centro de la base.
   *   w 520, screen color, schem, seed. Devuelve la pantalla { x0, y0, x1, y1 }.
   */
  function laptop(ctx, o = {}) {
    const w = o.w || 520;
    const sh = w * 0.62;
    const x = o.x || 0, y = o.y || 0;
    const sd = o.seed || 251;
    const lid = { x0: x - w / 2, y0: y - sh - 10, x1: x + w / 2, y1: y - 10 };
    ink(ctx, L.rrectPts(lid.x0, lid.y0, w, sh, 18, 20), o, { closed: true, width: 5, fill: P.phoneCase, seed: sd });
    const scr = { x0: lid.x0 + 22, y0: lid.y0 + 22, x1: lid.x1 - 22, y1: lid.y1 - 22 };
    ink(ctx, L.rrectPts(scr.x0, scr.y0, scr.x1 - scr.x0, scr.y1 - scr.y0, 8, 20), o, { closed: true, width: 3, fill: o.screen || P.screen, seed: sd + 1 });
    const base = [[x - w / 2 - 60, y + 30], [x - w / 2 + 10, y - 8], [x + w / 2 - 10, y - 8], [x + w / 2 + 60, y + 30]];
    ink(ctx, base, o, { closed: true, width: 5, fill: P.serverGrey, seed: sd + 2, smooth: false });
    return scr;
  }

  FILM.cast = Object.freeze({
    caption, tag, phone, bubble, server, brick, notebook, remote, arrow, step, local,
    tableTop, tableLeg, mantel, calendar, person, laptop,
  });
})();

<script>
// ---- src\scenes\01-fecha.js
// 01 fecha : el almanaque de hojas pasa 16, 17, 18 y cae en JUEVES 19 NOVIEMBRE (T 1.0); círculo rojo de fibrón
// en T 1.5; a la derecha "En la Tarea del Aula Digital UCP" (T 2.0) y "Misma fecha para todas las parejas" (T 3.0).
// Rótulo "Se entrega el jueves 19/11, antes de la clase".
(function () {
  'use strict';
  const ID = 'fecha';
  const CX = 640, CY = 470;
  const DAYS = [
    { at: 0, day: '16', weekday: 'LUNES' },
    { at: 0.5, day: '17', weekday: 'MARTES' },
    { at: 0.75, day: '18', weekday: 'MIÉRCOLES' },
    { at: 1.0, day: '19', weekday: 'JUEVES' },
  ];

  FILM.scene({
    id: ID,
    draw(ctx, t, info) {
      const L = info.lib, P = L.pal, C = FILM.cast, E = L.ease;
      t = L.clamp(t, 0, info.dur);
      const tt = L.onTwos(t);
      const sd = L.hash(ID) & 0xffff;

      L.paper(ctx, { seed: 4 });
      ctx.save();
      ctx.globalAlpha = 0.5;
      L.stripes(ctx, { colors: [P.stripeCream, P.stripeYellow], width: 150, offset: tt * 30, seed: sd });
      ctx.restore();

      // hojas de atrás (el taco del almanaque)
      for (let i = 2; i >= 1; i--) {
        L.inkPath(ctx, L.rrectPts(CX - 220 + i * 8, CY - 260 + i * 9, 440, 520, 22, 22), {
          closed: true, width: 3, fill: P.paperShade, seed: sd + 70 + i,
        });
      }

      // hoja actual
      let cur = DAYS[0], prev = null;
      for (let i = 0; i < DAYS.length; i++) if (tt >= DAYS[i].at) { cur = DAYS[i]; prev = DAYS[i - 1] || null; }
      const land = cur.day === '19' ? L.clamp((tt - 1.0) / 0.17) : 1;
      const bounce = cur.day === '19' && land < 1 ? 1 + 0.05 * Math.sin(land * Math.PI) : 1;
      C.calendar(ctx, { x: CX, y: CY, s: bounce, day: cur.day, weekday: cur.weekday, seed: sd + 1 });

      // la hoja que se arranca: cae y se va
      if (prev && tt - cur.at < 0.25) {
        const k = (tt - cur.at) / 0.25;
        ctx.save();
        ctx.globalAlpha *= 1 - k;
        ctx.translate(CX + 140 * k, CY + 40 * k + 220 * k * k);
        ctx.rotate(0.5 * k);
        C.calendar(ctx, { x: 0, y: 0, day: prev.day, weekday: prev.weekday, seed: sd + 2 });
        ctx.restore();
      }

      // círculo rojo de fibrón alrededor del 19: T 1.5 a 2.0
      if (tt >= 1.5) {
        const k = E.outCubic(L.clamp((tt - 1.5) / 0.5));
        const pts = L.ellipsePts(CX, CY + 100, 205, 128, 64, -0.06).map(([x, y], i) => [x, y + (i > 40 ? 4 : 0)]);
        pts.push([pts[0][0] + 30, pts[0][1] - 18]);
        L.inkPath(ctx, pts, { color: P.legoRed, width: 10, draw: k, seed: sd + 3, taper: [10, 16] });
      }

      // a la derecha: dónde y para quién
      const RX = 1210;
      if (tt >= 2.0) {
        const pop = E.outBack(L.clamp((tt - 2.0) / 0.17));
        ctx.save();
        ctx.translate(1080, 395);
        ctx.scale(pop, pop);
        C.laptop(ctx, { x: 0, y: 40, w: 150, seed: sd + 10, screen: P.washBlue });
        ctx.restore();
        const a = L.clamp((tt - 2.0) / 0.25);
        L.text(ctx, 'En la Tarea del', RX, 370, { size: 50, weight: 600, color: P.inkSoft, alpha: a });
        L.text(ctx, 'Aula Digital UCP', RX, 430, { size: 54, weight: 800, color: P.ink, alpha: a });
      }
      if (tt >= 3.0) {
        const pop = E.outBack(L.clamp((tt - 3.0) / 0.17));
        ctx.save();
        ctx.translate(1080, 660);
        ctx.scale(pop, pop);
        C.person(ctx, { x: -34, y: 0, s: 0.3, shirt: P.teal, seed: sd + 20 });
        C.person(ctx, { x: 34, y: 6, s: 0.3, shirt: P.ochre, hair: P.wood, seed: sd + 21 });
        ctx.restore();
        const a = L.clamp((tt - 3.0) / 0.25);
        L.text(ctx, 'Misma fecha para', RX, 630, { size: 50, weight: 600, color: P.inkSoft, alpha: a });
        L.text(ctx, 'todas las parejas', RX, 690, { size: 54, weight: 800, color: P.ink, alpha: a });
      }

      C.caption(ctx, 'Se entrega el jueves 19/11, antes de la clase', L.clamp(t / 0.25));
    },
  });
})();

</script>
<script>
// ---- src\scenes\02-patas.js
// 02 patas : plano azul de la mesa (G1). La tabla se traza en T 4.0; las patas en T 4.5, 5, 5.5, 6 (t 0.5..2.0)
// con A1 Odoo, A2 Bizagi, A3 n8n o Make, A4 Proteger datos. En T 6.5 (t 2.5) la línea "mínimo 10" y las patas
// se llenan como termómetros hasta 12, 13, 11 y 12 (de 15); en T 7.5 (t 3.5) tildan las cuatro.
(function () {
  'use strict';
  const ID = 'patas';
  // G1: tabla centrada en (960, 300), 1120 × 56; patas en x 480, 800, 1120, 1440, de y 328 a 740.
  const LEGS = [
    { x: 480, code: 'A1', name: 'Odoo', val: 12, at: 0.5 },
    { x: 800, code: 'A2', name: 'Bizagi', val: 13, at: 1.0 },
    { x: 1120, code: 'A3', name: 'n8n o Make', val: 11, at: 1.5 },
    { x: 1440, code: 'A4', name: 'Proteger datos', val: 12, at: 2.0 },
  ];
  const Y0 = 328, Y1 = 740, LW = 70;
  const yOf = (v) => Y1 - ((Y1 - Y0) * v) / 15;

  FILM.scene({
    id: ID,
    draw(ctx, t, info) {
      const L = info.lib, P = L.pal, C = FILM.cast, E = L.ease;
      t = L.clamp(t, 0, info.dur);
      const tt = L.onTwos(t);
      const sd = L.hash(ID) & 0xffff;

      L.blueprint(ctx, { seed: 31, center: [960, 520], circles: 0, diagonals: 0 });

      // la tabla
      C.tableTop(ctx, { x: 960, y: 300, w: 1120, schem: true, draw: Math.max(0.001, E.inOutSine(L.clamp(tt / 0.4))), seed: sd + 1 });
      // el piso
      L.inkPath(ctx, [[300, Y1 + 2], [1620, Y1 + 2]], { color: P.lavender, width: 2, alpha: 0.5, seed: sd + 2 });

      // escala a la izquierda
      const fill = E.inOutCubic(L.clamp((tt - 2.5) / 1.0));
      if (tt >= 2.0) {
        const a = L.clamp((tt - 2.0) / 0.25);
        for (const [v, s] of [[15, '15'], [10, '10'], [0, '0']]) {
          L.text(ctx, s, 392, yOf(v) + 14, { size: 40, weight: 700, align: 'right', color: v === 10 ? P.magenta : P.lavender, alpha: a });
          L.inkPath(ctx, [[402, yOf(v)], [432, yOf(v)]], { color: P.lavender, width: 2.4, alpha: a, smooth: false, seed: sd + 3 + v });
        }
      }

      LEGS.forEach((g, i) => {
        if (tt < g.at) return;
        const k = L.clamp((tt - g.at) / 0.25);
        // el termómetro: se llena desde abajo
        if (fill > 0) {
          const top = L.lerp(Y1, yOf(g.val), fill);
          ctx.save();
          ctx.fillStyle = L.rgba(P.schemGreen, 0.55);
          ctx.fillRect(g.x - LW / 2 + 7, top, LW - 14, Y1 - top - 4);
          ctx.restore();
          if (fill >= 1) L.text(ctx, String(g.val), g.x, top - 12, { size: 40, weight: 800, align: 'center', color: P.lineWhite });
        }
        C.tableLeg(ctx, { x: g.x, y0: Y0, y1: Y1, w: LW, schem: true, draw: Math.max(0.001, k), seed: sd + 10 + i });
        if (k >= 1) {
          L.glowDot(ctx, g.x, Y0 + 4, 8, { color: P.schemGreen, rays: 0, intensity: tt - g.at < 0.4 ? 1 : 0.4, seed: sd + 20 + i });
        }
        const a = L.clamp((tt - g.at) / 0.17);
        const ok = tt >= 3.5;
        L.text(ctx, g.code, ok ? g.x - 22 : g.x, 806, { size: 46, weight: 800, align: 'center', color: ok ? P.schemGreen : P.lavender, alpha: a });
        if (ok) {
          const kk = E.outCubic(L.clamp((tt - 3.5) / 0.17));
          const cx = g.x + 32, cy = 790;
          L.inkPath(ctx, [[cx - 16, cy], [cx - 4, cy + 14], [cx + 22, cy - 20]], { color: P.schemGreen, width: 6, draw: kk, smooth: false, seed: sd + 30 + i, taper: [3, 6] });
        }
        L.text(ctx, g.name, g.x, 856, { size: 40, weight: 600, align: 'center', color: P.lineWhite, alpha: a });
      });

      // línea del mínimo: T 6.5
      if (tt >= 2.5) {
        const k = L.clamp((tt - 2.5) / 0.25);
        const y = yOf(10);
        ctx.save();
        ctx.setLineDash([18, 12]);
        ctx.strokeStyle = P.magenta;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(440, y);
        ctx.lineTo(L.lerp(440, 1500, k), y);
        ctx.stroke();
        ctx.restore();
        if (k >= 1) {
          L.text(ctx, 'mínimo', 1520, y - 14, { size: 44, weight: 800, color: P.magenta });
          L.text(ctx, '10 de 15', 1520, y + 36, { size: 44, weight: 800, color: P.magenta });
        }
      }

      C.caption(ctx, '4 patas obligatorias: cada una tiene que llegar a 10 de 15', L.clamp(t / 0.25), { schem: true });
    },
  });
})();

</script>
<script>
// ---- src\scenes\03-se-cae.js
// 03 se-cae : la mesa de colores (G1) con la pata A3 corta. T 9.0 (t 0.5) chapita roja "7 de 15"; T 9.5 (t 1.0)
// tambalea; T 10.0 (t 1.5) se cae con polvo; T 10.5 (t 2.0) sello "NO APRUEBA · nota máxima 5 · los extras no cuentan".
(function () {
  'use strict';
  const ID = 'se-cae';
  const FLOOR = 740, Y0 = 328, LW = 70;
  const LEGS = [
    { x: 480, code: 'A1', name: 'Odoo', val: '12', col: 'odooPlum', dir: -1 },
    { x: 800, code: 'A2', name: 'Bizagi', val: '13', col: 'orange', dir: -1 },
    { x: 1120, code: 'A3', name: 'n8n o Make', val: '7', col: 'annMagenta', dir: 1, short: 150 },
    { x: 1440, code: 'A4', name: 'Proteger datos', val: '12', col: 'teal', dir: 1 },
  ];

  FILM.scene({
    id: ID,
    draw(ctx, t, info) {
      const L = info.lib, P = L.pal, C = FILM.cast, E = L.ease;
      t = L.clamp(t, 0, info.dur);
      const tt = L.onTwos(t);
      const sd = L.hash(ID) & 0xffff;

      L.paper(ctx, { color: P.paperCream, seed: 8 });
      // piso con sombra rayada
      L.hatch(ctx, L.rectPts(220, FLOOR, 1480, 26, 24), { spacing: 9, width: 1.6, color: P.inkFaint, alpha: 0.6, seed: sd + 1, length: [20, 60] });
      L.inkPath(ctx, [[200, FLOOR], [1720, FLOOR]], { color: P.ink, width: 4, seed: sd + 2 });

      // tambaleo 1.0–1.5 y caída 1.5–1.85
      const wob = tt >= 1.0 && tt < 1.5 ? Math.sin((tt - 1.0) * 6 * Math.PI) * 0.03 * ((tt - 1.0) / 0.5 + 0.3) : 0;
      const f = E.outBounce(L.clamp((tt - 1.5) / 0.4));
      const fallen = tt >= 1.5;

      ctx.save();
      // el tambaleo gira toda la mesa alrededor del pie de A2
      ctx.translate(800, FLOOR);
      ctx.rotate(wob);
      ctx.translate(-800, -FLOOR);

      LEGS.forEach((g, i) => {
        const y1 = FLOOR - (g.short || 0);
        ctx.save();
        if (fallen) {
          // cada pata cae hacia afuera girando sobre su pie
          const ang = g.dir * 1.5 * f;
          ctx.translate(g.x, FLOOR - (g.short ? (1 - f) * g.short : 0));
          ctx.rotate(ang);
          ctx.translate(-g.x, -FLOOR);
        }
        const yy0 = fallen && g.short ? Y0 + g.short : Y0;
        const yy1 = fallen && g.short ? FLOOR : y1;
        C.tableLeg(ctx, { x: g.x, y0: yy0, y1: yy1, w: LW, fill: P[g.col], seed: sd + 10 + i });
        ctx.restore();
      });

      // la tabla: cae sobre las patas
      const topY = L.lerp(300, FLOOR - 40, f);
      ctx.save();
      ctx.translate(960, topY);
      ctx.rotate(0.07 * f);
      C.tableTop(ctx, { x: 0, y: 0, w: 1240, seed: sd + 3 });
      ctx.restore();
      ctx.restore();

      // chapitas con el puntaje: fuera de la rotación, para que siempre se lean derechas
      LEGS.forEach((g, i) => {
        const bad = !!g.short;
        if (bad) {
          if (tt < 0.5) return;
          const pop = E.outBack(L.clamp((tt - 0.5) / 0.17));
          const y = fallen ? L.lerp((Y0 + FLOOR - g.short) / 2, 620, f) : (Y0 + FLOOR - g.short) / 2;
          C.tag(ctx, '7 de 15', g.x, y, { size: 48, pop, fill: P.legoRed, color: P.white, seed: sd + 20 + i, rot: -0.06 });
        } else {
          const a = fallen ? 1 - L.clamp((tt - 1.5) / 0.12) : 1;
          if (a <= 0) return;
          ctx.save();
          ctx.globalAlpha *= a;
          C.tag(ctx, g.val, g.x, (Y0 + FLOOR) / 2, { size: 40, fill: P.white, color: P.ink, seed: sd + 20 + i });
          ctx.restore();
        }
      });

      // hueco debajo de la pata corta, antes de caer
      if (!fallen && tt >= 0.5) {
        const a = L.clamp((tt - 0.5) / 0.25);
        ctx.save();
        ctx.globalAlpha *= a;
        ctx.setLineDash([8, 8]);
        ctx.strokeStyle = P.legoRed;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(1120, FLOOR - 140);
        ctx.lineTo(1120, FLOOR - 10);
        ctx.stroke();
        ctx.restore();
        L.text(ctx, 'no llega', 1170, FLOOR - 52, { size: 40, weight: 700, color: P.legoRed, alpha: a });
      }

      // polvo y líneas al chocar
      if (tt >= 1.75 && tt < 2.6) {
        const k = L.clamp((tt - 1.75) / 0.85);
        for (const [x, s] of [[420, -1], [760, -1], [1180, 1], [1520, 1]]) {
          FILM.props.dust(ctx, x, FLOOR - 6, { draw: 1, r: 20 + 18 * k, spread: 40 + 40 * k, seed: sd + 40 + x });
          FILM.props.speedLines(ctx, { x: x + s * 90, y: FLOOR - 60, n: 3, len: 40 + 30 * k, gap: 18, dir: s, seed: sd + 50 + x, alpha: 1 - k });
        }
      }

      // nombres de las patas (quedan fijos)
      LEGS.forEach((g) => {
        const bad = !!g.short;
        L.text(ctx, g.code, g.x, 806, { size: 46, weight: 800, align: 'center', color: bad ? P.legoRed : P.ink });
        L.text(ctx, g.name, g.x, 856, { size: 40, weight: 600, align: 'center', color: bad ? P.legoRed : P.inkSoft });
      });

      // el sello
      if (tt >= 2.0) {
        const k = E.outCubic(L.clamp((tt - 2.0) / 0.17));
        const s = L.lerp(1.6, 1, k);
        ctx.save();
        ctx.translate(960, 330);
        ctx.rotate(-0.07);
        ctx.scale(s, s);
        ctx.globalAlpha *= L.clamp(k * 2);
        const box = L.rrectPts(-450, -105, 900, 210, 26, 20);
        L.inkPath(ctx, box, { closed: true, color: P.legoRed, width: 9, fill: L.rgba(P.white, 0.9), seed: sd + 60 });
        L.inkPath(ctx, L.rrectPts(-432, -88, 864, 176, 18, 20), { closed: true, color: P.legoRed, width: 3, seed: sd + 61 });
        L.text(ctx, 'NO APRUEBA', 0, 6, { size: 92, weight: 900, align: 'center', color: P.legoRed, tracking: 4 });
        L.text(ctx, 'nota máxima 5 · los extras no cuentan', 0, 62, { size: 40, weight: 700, align: 'center', color: P.legoRed });
        ctx.restore();
      }

      C.caption(ctx, 'Si una sola pata no llega, la mesa se cae', L.clamp(t / 0.25));
    },
  });
})();

</script>
<script>
// ---- src\scenes\04-mantel.js
// 04 mantel : plano azul. Mesa en pie (más chica que G1): tabla (960, 560) 1000 × 50, patas x 560, 827, 1093, 1360.
// T 12.5 (t 0.5) "B · Calidad 25 puntos" a la izquierda y "A · 4 patas 60 puntos" a la derecha. T 13.0 (t 1.0) aterriza
// el mantel "C · Extras". T 14, 14.5, 15 (t 2.0, 2.5, 3.0) aparecen arriba Mensajes y alertas, Servidor propio y Tablero.
(function () {
  'use strict';
  const ID = 'mantel';
  const TOPY = 560, TH = 50, LEG0 = TOPY + TH / 2, LEG1 = 830;
  const LEGX = [560, 827, 1093, 1360];
  const ITEMS = [
    { x: 560, name: 'Mensajes y alertas', at: 2.0 },
    { x: 960, name: 'Servidor propio', at: 2.5 },
    { x: 1360, name: 'Tablero', at: 3.0 },
  ];

  FILM.scene({
    id: ID,
    draw(ctx, t, info) {
      const L = info.lib, P = L.pal, C = FILM.cast, E = L.ease;
      t = L.clamp(t, 0, info.dur);
      const tt = L.onTwos(t);
      const sd = L.hash(ID) & 0xffff;
      const SURF = TOPY - TH / 2; // cara de arriba de la tabla

      L.blueprint(ctx, { seed: 47, center: [960, 520], circles: 0, diagonals: 0 });
      L.inkPath(ctx, [[380, LEG1 + 2], [1540, LEG1 + 2]], { color: P.lavender, width: 2, alpha: 0.5, seed: sd + 1 });

      // la mesa en pie, con sus cuatro patas en verde (todas llegaron)
      LEGX.forEach((x, i) => {
        ctx.save();
        ctx.fillStyle = L.rgba(P.schemGreen, 0.4);
        ctx.fillRect(x - 21, LEG0 + 4, 42, LEG1 - LEG0 - 8);
        ctx.restore();
        C.tableLeg(ctx, { x, y0: LEG0, y1: LEG1, w: 56, schem: true, seed: sd + 10 + i });
      });
      C.tableTop(ctx, { x: 960, y: TOPY, w: 1000, h: TH, schem: true, seed: sd + 2 });

      // A y B: T 12.5
      if (tt >= 0.5) {
        const a = L.clamp((tt - 0.5) / 0.2);
        L.text(ctx, 'B · Calidad', 420, SURF + 20, { size: 48, weight: 800, align: 'right', color: P.lineWhite, alpha: a });
        L.text(ctx, '25 puntos', 420, SURF + 74, { size: 44, weight: 700, align: 'right', color: P.paleBlue, alpha: a });
        C.arrow(ctx, 426, SURF + 96, 470, TOPY + 10, { schem: true, p: L.clamp((tt - 0.6) / 0.2), head: 16, bend: 10, seed: sd + 3 });
        L.text(ctx, 'A · 4 patas', 1420, 720, { size: 48, weight: 800, color: P.lineWhite, alpha: a });
        L.text(ctx, '60 puntos', 1420, 774, { size: 44, weight: 700, color: P.schemGreen, alpha: a });
      }

      // el mantel: cae de t 0.7 a 1.0 y aterriza en T 13.0
      if (tt >= 0.7) {
        const k = L.clamp((tt - 0.7) / 0.3);
        const dy = -230 * (1 - k * k);
        const land = tt >= 1.0 && tt < 1.17 ? Math.sin(((tt - 1.0) / 0.17) * Math.PI) : 0;
        ctx.save();
        ctx.translate(0, dy);
        const m = C.mantel(ctx, { x: 960, y: SURF, w: 880, drop: 118 + 10 * land, schem: true, alpha: L.clamp(k * 2), seed: sd + 4 });
        ctx.restore();
        if (tt >= 1.0) {
          C.tag(ctx, 'C · Extras', 960, (m.y0 + m.y1) / 2 + 4, { schem: true, size: 46, pop: E.outBack(L.clamp((tt - 1.0) / 0.17)), seed: sd + 5 });
        }
      }

      // los tres extras, apoyados sobre el mantel
      const base = SURF - 8;
      ITEMS.forEach((it, i) => {
        if (tt < it.at) return;
        const pop = E.outBack(L.clamp((tt - it.at) / 0.17));
        ctx.save();
        ctx.translate(it.x, base);
        ctx.scale(pop, pop);
        if (i === 0) {
          C.phone(ctx, { x: 0, y: -80, h: 150, schem: true, seed: sd + 30 });
          // campanita de alerta
          L.inkCircle(ctx, 58, -150, 22, { color: P.magenta, width: 3, seed: sd + 31 });

<script>
// ---- src\scenes\05-reglas.js
// 05 reglas : tres tarjetas que entran en T 16.5, 17.5 y 18.5 (t 0.5, 1.5, 2.5).
//   1 la llave de la API tapada con PEGAR_ACA: "Ninguna clave a la vista" (si se ve: A4 máx. 10)
//   2 la ficha de un cliente inventado: "Datos de Odoo inventados" (ni un cliente real)
//   3 el sobre de la invitación: "Docente invitado a tu Odoo" (sin acceso: A1 = 0)
(function () {
  'use strict';
  const ID = 'reglas';
  const CW = 520, CY0 = 150, CY1 = 800;
  const CARDS = [
    { x: 350, at: 0.5, lines: ['Ninguna clave', 'a la vista'], warn: 'si se ve: A4 máx. 10', tint: 'stripeYellow' },
    { x: 960, at: 1.5, lines: ['Datos de Odoo', 'inventados'], warn: 'ni un cliente real', tint: 'stripeSage' },
    { x: 1570, at: 2.5, lines: ['Docente invitado', 'a tu Odoo'], warn: 'sin acceso: A1 = 0', tint: 'stripeSky' },
  ];

  FILM.scene({
    id: ID,
    draw(ctx, t, info) {
      const L = info.lib, P = L.pal, C = FILM.cast, E = L.ease;
      t = L.clamp(t, 0, info.dur);
      const tt = L.onTwos(t);
      const sd = L.hash(ID) & 0xffff;

      L.paper(ctx, { color: P.paperButter, seed: 12 });

      CARDS.forEach((c, i) => {
        // hueco punteado mientras la tarjeta no llegó
        if (tt < c.at) {
          ctx.save();
          ctx.setLineDash([12, 12]);
          ctx.strokeStyle = P.inkFaint;
          ctx.globalAlpha = 0.5;
          ctx.lineWidth = 3;
          ctx.strokeRect(c.x - CW / 2, CY0, CW, CY1 - CY0);
          ctx.restore();
          L.text(ctx, String(i + 1), c.x, (CY0 + CY1) / 2 + 30, { size: 90, weight: 800, align: 'center', color: P.inkFaint, alpha: 0.45 });
          return;
        }
        const k = L.clamp((tt - c.at) / 0.2);
        const pop = E.outBack(k);
        const cy = (CY0 + CY1) / 2;
        ctx.save();
        ctx.translate(c.x, cy);
        ctx.rotate((1 - k) * 0.12 * (i - 1 || 1) + (i - 1) * 0.015);
        ctx.scale(0.7 + 0.3 * pop, 0.7 + 0.3 * pop);
        ctx.globalAlpha *= L.clamp(k * 3);
        ctx.translate(-c.x, -cy);

        // la tarjeta
        L.inkPath(ctx, L.rrectPts(c.x - CW / 2 + 10, CY0 + 12, CW, CY1 - CY0, 26, 24), { closed: true, width: 0.1, fill: P.paperDeep, seed: sd + 1 + i });
        L.inkPath(ctx, L.rrectPts(c.x - CW / 2, CY0, CW, CY1 - CY0, 26, 24), { closed: true, width: 4.5, fill: P.white, seed: sd + 4 + i });
        L.inkPath(ctx, L.rrectPts(c.x - CW / 2 + 22, CY0 + 22, CW - 44, 330, 18, 24), { closed: true, width: 2.4, fill: P[c.tint], seed: sd + 7 + i });
        // número
        L.inkCircle(ctx, c.x - CW / 2 + 10, CY0 + 10, 36, { width: 4, fill: P.ink, seed: sd + 10 + i });
        L.text(ctx, String(i + 1), c.x - CW / 2 + 10, CY0 + 26, { size: 44, weight: 800, align: 'center', color: P.white });

        const ix = c.x, iy = CY0 + 190;
        if (i === 0) {
          // llave dorada que apunta a la etiqueta PEGAR_ACA
          ctx.save();
          ctx.translate(ix - 10, iy - 60);
          ctx.rotate(-0.2);
          L.inkCircle(ctx, -90, 0, 44, { width: 5, fill: P.sun, seed: sd + 20 });
          L.inkCircle(ctx, -90, 0, 14, { width: 3, fill: P.stripeYellow, seed: sd + 21 });
          L.inkPath(ctx, L.rectPts(-48, -12, 170, 24, 20), { closed: true, width: 4.5, fill: P.sun, seed: sd + 22 });
          L.inkPath(ctx, [[80, 12], [80, 40], [100, 40], [100, 12]], { width: 4, fill: P.sun, smooth: false, seed: sd + 23 });
          L.inkPath(ctx, [[110, 12], [110, 32], [122, 32]], { width: 4, smooth: false, seed: sd + 24 });
          ctx.restore();
          C.tag(ctx, 'PEGAR_ACA', ix, iy + 95, { size: 44, fill: P.washYellow, seed: sd + 25, rot: 0.03 });
        } else if (i === 1) {
          // ficha de un cliente inventado
          L.inkPath(ctx, L.rrectPts(ix - 200, iy - 125, 400, 250, 14, 20), { closed: true, width: 4, fill: P.white, seed: sd + 30 });
          L.inkCircle(ctx, ix - 125, iy - 40, 46, { width: 4, fill: P.duskRose, seed: sd + 31 });
          L.inkPath(ctx, [[ix - 165, iy + 40], [ix - 125, iy + 10], [ix - 85, iy + 40]], { width: 4, seed: sd + 32 });
          L.text(ctx, 'Cliente', ix - 55, iy - 52, { size: 40, weight: 600, color: P.inkSoft });
          L.text(ctx, 'Juana', ix - 55, iy + 2, { size: 44, weight: 800, color: P.ink });
          L.text(ctx, 'Inventada', ix - 55, iy + 52, { size: 44, weight: 800, color: P.ink });
          C.tag(ctx, 'ficticio', ix + 110, iy + 118, { size: 40, fill: P.okGreen, color: P.white, rot: -0.08, seed: sd + 33 });
        } else {
          // sobre de la invitación con el sello de Odoo
          const ex0 = ix - 190, ey0 = iy - 110, ew = 380, eh = 230;
          L.inkPath(ctx, L.rrectPts(ex0, ey0, ew, eh, 12, 20), { closed: true, width: 4.5, fill: P.white, seed: sd + 40 });
          L.inkPath(ctx, [[ex0 + 6, ey0 + 8], [ix, ey0 + 130], [ex0 + ew - 6, ey0 + 8]], { width: 4, smooth: false, seed: sd + 41 });
          L.inkCircle(ctx, ix, ey0 + 130, 44, { width: 4, fill: P.odooPlum, seed: sd + 42 });
          L.inkPath(ctx, [[ix - 18, ey0 + 130], [ix - 4, ey0 + 146], [ix + 22, ey0 + 112]], { color: P.white, width: 6, smooth: false, seed: sd + 43, taper: [3, 5] });
          C.tag(ctx, 'invitación', ix + 30, iy + 125, { size: 40, fill: P.odooPlum, color: P.white, rot: 0.05, seed: sd + 44 });
        }

        L.text(ctx, c.lines[0], c.x, CY0 + 432, { size: 48, weight: 800, align: 'center', color: P.ink });
        L.text(ctx, c.lines[1], c.x, CY0 + 490, { size: 48, weight: 800, align: 'center', color: P.ink });
        L.inkPath(ctx, [[c.x - 190, CY0 + 530], [c.x + 190, CY0 + 530]], { width: 2, color: P.inkFaint, seed: sd + 50 + i });
        L.text(ctx, c.warn, c.x, CY0 + 590, { size: 40, weight: 700, align: 'center', color: P.legoRed });
        ctx.restore();
      });

      C.caption(ctx, 'Tres reglas que no se negocian', L.clamp(t / 0.25));
    },
  });
})();

</script>
<script>
// ---- src\scenes\06-aparte.js
// 06 aparte : plano azul. T 20.5 (t 0.5) la carpeta "Portafolio Digital" de la pareja; T 21.5 (t 1.5) dos cuadernos
// "Bitácora individual, una por persona"; T 22.5 (t 2.5) la franja "El informe y la Bitácora se escriben sin IA".
(function () {
  'use strict';
  const ID = 'aparte';

  FILM.scene({
    id: ID,
    draw(ctx, t, info) {
      const L = info.lib, P = L.pal, C = FILM.cast, E = L.ease;
      t = L.clamp(t, 0, info.dur);
      const tt = L.onTwos(t);
      const sd = L.hash(ID) & 0xffff;

      L.blueprint(ctx, { seed: 61, center: [960, 460], circles: 0, diagonals: 0 });

      // huecos punteados donde van a aparecer la carpeta y los cuadernos
      ctx.save();
      ctx.setLineDash([12, 12]);
      ctx.strokeStyle = P.lavender;
      ctx.globalAlpha = 0.35;
      ctx.lineWidth = 2.5;
      if (tt < 0.5) ctx.strokeRect(360, 260, 400, 280);
      if (tt < 1.5) {
        ctx.strokeRect(1135, 250, 210, 290);
        ctx.strokeRect(1375, 250, 210, 290);
      }
      ctx.restore();

      // la carpeta del Portafolio
      if (tt >= 0.5) {
        const pop = E.outBack(L.clamp((tt - 0.5) / 0.17));
        ctx.save();
        ctx.translate(560, 400);
        ctx.scale(pop, pop);
        // hojas que asoman
        for (let i = 0; i < 3; i++) {
          L.inkPath(ctx, L.rectPts(-160 + i * 30, -160 - i * 10, 280, 200, 20), { closed: true, color: P.lavender, width: 2.6, seed: sd + 1 + i });
          for (let r = 0; r < 3; r++) L.inkPath(ctx, [[-130 + i * 30, -120 - i * 10 + r * 30], [60 + i * 30, -120 - i * 10 + r * 30]], { color: P.paleBlue, width: 2, alpha: 0.6, seed: sd + 5 + i * 3 + r });
        }
        // la carpeta
        L.inkPath(ctx, [[-200, -110], [-200, -140], [-70, -140], [-40, -110]], { color: P.lineWhite, width: 3.4, smooth: false, seed: sd + 20 });
        L.inkPath(ctx, L.rrectPts(-200, -110, 400, 250, 16, 20), { closed: true, color: P.lineWhite, width: 3.6, fill: P.navyLight, seed: sd + 21 });
        L.text(ctx, 'AE1 · AE2 · flujos', 0, -10, { size: 40, weight: 600, align: 'center', color: P.paleBlue });
        L.text(ctx, 'decisiones', 0, 50, { size: 40, weight: 600, align: 'center', color: P.paleBlue });
        ctx.restore();
        const a = L.clamp((tt - 0.5) / 0.2);
        L.text(ctx, 'Portafolio Digital', 560, 620, { size: 52, weight: 800, align: 'center', color: P.lineWhite, alpha: a });
        L.text(ctx, 'abierto para el docente', 560, 676, { size: 42, weight: 600, align: 'center', color: P.lavender, alpha: a });
      }

      // las dos Bitácoras
      if (tt >= 1.5) {
        [[1240, -0.05, 0], [1480, 0.05, 1]].forEach(([x, rot, j]) => {
          const pop = E.outBack(L.clamp((tt - 1.5 - j * 0.08) / 0.17));
          if (pop <= 0) return;
          ctx.save();
          ctx.translate(x, 400);
          ctx.rotate(rot);
          ctx.scale(pop, pop);
          L.inkPath(ctx, L.rrectPts(-105, -150, 210, 290, 14, 20), { closed: true, color: P.lineWhite, width: 3.6, fill: P.navyLight, seed: sd + 30 + j });
          L.inkPath(ctx, [[-80, -150], [-80, 140]], { color: P.lavender, width: 2.6, seed: sd + 32 + j });
          C.person(ctx, { x: 10, y: -10, s: 0.32, schem: true, seed: sd + 34 + j });
          L.text(ctx, j ? 'Juan' : 'Ana', 10, 100, { size: 40, weight: 700, align: 'center', color: P.lineWhite });
          ctx.restore();
        });
        const a = L.clamp((tt - 1.5) / 0.2);
        L.text(ctx, 'Bitácora individual', 1360, 620, { size: 52, weight: 800, align: 'center', color: P.lineWhite, alpha: a });
        L.text(ctx, 'una por persona', 1360, 676, { size: 42, weight: 600, align: 'center', color: P.lavender, alpha: a });
      }

      // la franja: sin IA
      if (tt >= 2.5) {
        const k = E.outBack(L.clamp((tt - 2.5) / 0.17));
        ctx.save();
        ctx.translate(960, 790);
        ctx.scale(k, k);
        L.inkPath(ctx, L.rrectPts(-580, -50, 1160, 100, 50, 24), { closed: true, color: P.magenta, width: 3.6, fill: P.navyDeep, seed: sd + 40 });
        // robot tachado
        const rx = -505;
        L.inkPath(ctx, L.rrectPts(rx - 32, -26, 64, 52, 12, 12), { closed: true, color: P.lineWhite, width: 3, seed: sd + 41 });
        L.inkPath(ctx, [[rx, -26], [rx, -38]], { color: P.lineWhite, width: 3, seed: sd + 42 });
        L.inkCircle(ctx, rx, -42, 5, { color: P.lineWhite, width: 2.4, seed: sd + 43 });
        for (const ex of [-12, 12]) L.inkCircle(ctx, rx + ex, -6, 5, { color: P.lineWhite, width: 2.4, seed: sd + 44 + ex });
        L.inkLine(ctx, rx - 44, 40, rx + 44, -44, { color: P.magenta, width: 7, seed: sd + 46 });
        L.text(ctx, 'El informe y la Bitácora se escriben sin IA', -438, 16, { size: 46, weight: 800, color: P.lineWhite });
        ctx.restore();
      }

      C.caption(ctx, 'Además: el Portafolio y una Bitácora por persona', L.clamp(t / 0.25), { schem: true });
    },
  });
})();

<script>
// ---- src\scenes\07-coloquio.js
// 07 coloquio : reloj de 10 minutos. La porción verde (3 min, demo) se llena de T 24.5 a 25.5 (t 0.5–1.5); la
// amarilla (7 min, preguntas) de T 25.5 a 27.0 (t 1.5–3.0). Leyenda a la derecha: cada renglón entra con su porción.
(function () {
  'use strict';
  const ID = 'coloquio';
  const CX = 600, CY = 480, R = 300;
  const A0 = -Math.PI / 2;
  const DEMO = (3 / 10) * Math.PI * 2;

  function wedge(ctx, a0, a1, color, alpha) {
    ctx.save();
    ctx.globalAlpha *= alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.arc(CX, CY, R - 14, a0, a1);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  FILM.scene({
    id: ID,
    draw(ctx, t, info) {
      const L = info.lib, P = L.pal, C = FILM.cast, E = L.ease;
      t = L.clamp(t, 0, info.dur);
      const tt = L.onTwos(t);
      const sd = L.hash(ID) & 0xffff;

      L.paper(ctx, { color: P.paperSky, seed: 15 });
      ctx.save();
      ctx.globalAlpha = 0.35;
      L.stripes(ctx, { colors: [P.stripeCream, P.stripeSky], width: 170, offset: tt * 24, seed: sd });
      ctx.restore();

      // el reloj
      L.inkCircle(ctx, CX + 12, CY + 16, R, { width: 0.1, fill: P.paperDeep, seed: sd + 1 });
      L.inkCircle(ctx, CX, CY, R, { width: 6, fill: P.white, seed: sd + 2 });

      const kDemo = E.inOutSine(L.clamp((tt - 0.5) / 1.0));
      const kPreg = E.inOutSine(L.clamp((tt - 1.5) / 1.5));
      if (kDemo > 0) wedge(ctx, A0, A0 + DEMO * kDemo, P.okGreen, 0.85);
      if (kPreg > 0) wedge(ctx, A0 + DEMO, A0 + DEMO + (Math.PI * 2 - DEMO) * kPreg, P.sun, 0.9);

      // marcas de los 10 minutos
      for (let i = 0; i < 10; i++) {
        const a = A0 + (i / 10) * Math.PI * 2;
        L.inkLine(ctx, CX + Math.cos(a) * (R - 40), CY + Math.sin(a) * (R - 40), CX + Math.cos(a) * (R - 12), CY + Math.sin(a) * (R - 12), {
          width: i === 0 || i === 3 ? 7 : 4, seed: sd + 10 + i,
        });
      }
      // separador entre demo y preguntas
      if (kDemo >= 1) {
        const a = A0 + DEMO;
        L.inkLine(ctx, CX, CY, CX + Math.cos(a) * (R - 14), CY + Math.sin(a) * (R - 14), { width: 5, seed: sd + 25 });
        L.inkLine(ctx, CX, CY, CX, CY - (R - 14), { width: 5, seed: sd + 26 });
      }

      // aguja: sigue el borde de lo que se va llenando
      const prog = tt < 1.5 ? DEMO * kDemo : DEMO + (Math.PI * 2 - DEMO) * kPreg;
      const ah = A0 + prog;
      L.inkLine(ctx, CX, CY, CX + Math.cos(ah) * (R - 60), CY + Math.sin(ah) * (R - 60), { width: 9, color: P.legoRed, seed: sd + 27, taper: [2, 8] });

      // los números en cada porción
      if (kDemo >= 1) {
        const a = A0 + DEMO / 2;
        L.text(ctx, '3', CX + Math.cos(a) * 190, CY + Math.sin(a) * 190 + 32, { size: 96, weight: 900, align: 'center', color: P.white });
      }
      if (kPreg >= 1) {
        const a = A0 + DEMO + (Math.PI * 2 - DEMO) / 2;
        L.text(ctx, '7', CX + Math.cos(a) * 190, CY + Math.sin(a) * 190 + 32, { size: 96, weight: 900, align: 'center', color: P.ink });
      }
      // centro
      L.inkCircle(ctx, CX, CY, 92, { width: 5, fill: P.white, seed: sd + 28 });
      L.text(ctx, '10', CX, CY + 8, { size: 72, weight: 900, align: 'center', color: P.ink });
      L.text(ctx, 'min', CX, CY + 52, { size: 40, weight: 700, align: 'center', color: P.inkSoft });

      // la leyenda
      const LX = 1010;
      L.text(ctx, 'Coloquio de la pareja', LX, 250, { size: 62, weight: 800, color: P.ink, p: L.clamp(t / 0.4) });
      const rows = [
        { y: 420, at: 0.5, col: P.okGreen, main: '3 min: demo en vivo', sub: 'un flujo y su efecto en Odoo' },
        { y: 620, at: 1.5, col: P.sun, main: '7 min: preguntas', sub: 'se valida por persona' },
      ];
      rows.forEach((r, i) => {
        if (tt < r.at) return;
        const pop = E.outBack(L.clamp((tt - r.at) / 0.17));
        ctx.save();
        ctx.translate(LX + 40, r.y - 18);
        ctx.scale(pop, pop);
        L.inkPath(ctx, L.rrectPts(-38, -38, 76, 76, 16, 12), { closed: true, width: 4, fill: r.col, seed: sd + 40 + i });
        ctx.restore();
        const a = L.clamp((tt - r.at) / 0.2);
        L.text(ctx, r.main, LX + 110, r.y, { size: 54, weight: 800, color: P.ink, alpha: a });
        L.text(ctx, r.sub, LX + 110, r.y + 56, { size: 40, weight: 600, color: P.inkSoft, alpha: a });
      });

      C.caption(ctx, 'Coloquio: 10 minutos, 3 de demo y 7 de preguntas', L.clamp(t / 0.25));
    },
  });
})();

</script>
<script>
// ---- src\scenes\08-los-dos.js
// 08 los-dos : plano azul. Una notebook al centro con Odoo y n8n en la pantalla; un integrante a cada lado.
// T 28.5 (t 0.5) opera el de la izquierda (se enciende Odoo); T 29.0 (t 1.0) opera el de la derecha (se enciende n8n);
// T 30.0 (t 2.0) flechas cruzadas: cada uno explica también la parte que operó el otro.
(function () {
  'use strict';
  const ID = 'los-dos';
  const LX = 400, RX = 1520, PY = 720;

  FILM.scene({
    id: ID,
    draw(ctx, t, info) {
      const L = info.lib, P = L.pal, C = FILM.cast, E = L.ease;
      t = L.clamp(t, 0, info.dur);
      const tt = L.onTwos(t);
      const sd = L.hash(ID) & 0xffff;

      L.blueprint(ctx, { seed: 73, center: [960, 520], circles: 0, diagonals: 0 });

      // la notebook
      const scr = C.laptop(ctx, { x: 960, y: 720, w: 500, schem: true, seed: sd + 1 });
      const mid = (scr.x0 + scr.x1) / 2;
      const halves = [
        { x: (scr.x0 + mid) / 2, name: 'Odoo', at: 0.5 },
        { x: (mid + scr.x1) / 2, name: 'n8n', at: 1.0 },
      ];
      L.inkLine(ctx, mid, scr.y0 + 14, mid, scr.y1 - 14, { color: P.lavender, width: 2, alpha: 0.6, seed: sd + 2 });
      halves.forEach((h, i) => {
        const on = tt >= h.at;
        const cy = (scr.y0 + scr.y1) / 2;
        if (on) {
          const flash = tt - h.at < 0.3 ? 1 - (tt - h.at) / 0.3 : 0;
          const hx0 = i ? mid + 10 : scr.x0 + 10, hx1 = i ? scr.x1 - 10 : mid - 10;
          ctx.save();
          ctx.fillStyle = L.rgba(P.schemGreen, 0.16 + 0.25 * flash);
          ctx.fillRect(hx0, scr.y0 + 10, hx1 - hx0, scr.y1 - scr.y0 - 20);
          ctx.restore();
          L.inkPath(ctx, L.rrectPts(hx0, scr.y0 + 10, hx1 - hx0, scr.y1 - scr.y0 - 20, 8, 16), { closed: true, color: P.schemGreen, width: 3, seed: sd + 3 + i });
        }
        L.text(ctx, h.name, h.x, cy + 16, { size: 46, weight: 800, align: 'center', color: on ? P.lineWhite : P.lavender });
      });

      // los dos integrantes
      [[LX, 'Ana', 0.5, 1], [RX, 'Juan', 1.0, -1]].forEach(([x, name, at, dir], i) => {
        const on = tt >= at;
        // brazo hacia el teclado
        if (on) {
          const k = E.outCubic(L.clamp((tt - at) / 0.2));
          const sx = x + dir * 130, sy = PY + 40;
          const ex = L.lerp(sx, 960 - dir * 150, k), ey = L.lerp(sy, 735, k);
          L.inkPath(ctx, [[sx, sy], [(sx + ex) / 2, Math.max(sy, ey) + 30], [ex, ey]], { color: P.lavender, width: 3, seed: sd + 10 + i });
          L.inkCircle(ctx, ex, ey, 16, { color: P.lavender, width: 3, seed: sd + 12 + i });
        }
        C.person(ctx, { x, y: PY, s: 0.95, schem: true, seed: sd + 20 + i });
        L.text(ctx, name, x, PY + 110, { size: 44, weight: 800, align: 'center', color: P.lineWhite });
        if (on) C.tag(ctx, 'opera', x, 395, { schem: true, size: 44, pop: E.outBack(L.clamp((tt - at) / 0.17)), seed: sd + 25 + i });
      });

      // T 30.0: cada uno explica la parte del otro
      if (tt >= 2.0) {
        const k = L.clamp((tt - 2.0) / 0.3);
        C.arrow(ctx, LX + 60, 330, halves[1].x, scr.y0 - 16, { schem: true, p: k, bend: -90, color: P.schemGreen, width: 4, head: 22, seed: sd + 30 });
        C.arrow(ctx, RX - 60, 330, halves[0].x, scr.y0 - 16, { schem: true, p: k, bend: 90, color: P.schemGreen, width: 4, head: 22, seed: sd + 31 });
        const a = L.clamp((tt - 2.0) / 0.25);
        L.text(ctx, 'cada uno explica también lo que no operó', 960, 190, { size: 52, weight: 800, align: 'center', color: P.schemGreen, alpha: a });
      }

      C.caption(ctx, 'En la demo operan los dos integrantes', L.clamp(t / 0.25), { schem: true });
    },
  });
})();

// ---- src\scenes\09-resumen.js
// 09 resumen : la tarjeta para pausar. Título y tres renglones con ícono que entran en T 32.5, 33, 33.5
// (t 0.5, 1.0, 1.5): la fecha, las 4 patas y el Coloquio. Se sostiene hasta 36 para leer y sacar una foto.
(function () {
  'use strict';
  const ID = 'resumen';
  const IX = 330, TX = 480;
  const ROWS = [
    { y: 340, at: 0.5, main: 'Jueves 19/11, antes de la clase', sub: 'en la Tarea del Aula Digital UCP' },
    { y: 535, at: 1.0, main: 'Las 4 patas, cada una con 10 de 15', sub: 'si una no llega, no se aprueba y los extras no cuentan' },
    { y: 730, at: 1.5, main: 'Coloquio: operan los dos', sub: 'y cada uno explica también lo que no operó' },
  ];

  FILM.scene({
    id: ID,
    draw(ctx, t, info) {
      const L = info.lib, P = L.pal, C = FILM.cast, E = L.ease;
      t = L.clamp(t, 0, info.dur);
      const tt = L.onTwos(t);
      const sd = L.hash(ID) & 0xffff;

      L.paper(ctx, { seed: 19 });
      ctx.save();
      ctx.globalAlpha = 0.4;
      L.stripes(ctx, { colors: [P.stripeCream, P.stripeApricot], width: 160, offset: tt * 20, seed: sd });
      ctx.restore();

      // la hoja donde va la lista
      L.inkPath(ctx, L.rrectPts(196, 236, 1540, 640, 30, 24), { closed: true, width: 0.1, fill: P.paperDeep, seed: sd + 1 });
      L.inkPath(ctx, L.rrectPts(184, 222, 1540, 640, 30, 24), { closed: true, width: 4.5, fill: P.white, seed: sd + 2 });

      L.text(ctx, 'AE4: lo que no te podés olvidar', 960, 170, { size: 72, weight: 800, align: 'center', color: P.ink, p: L.clamp(t / 0.4) });

      const icons = [
        () => C.calendar(ctx, { x: 0, y: 0, s: 0.27, bare: true, seed: sd + 10 }),
        () => {
          C.tableTop(ctx, { x: 0, y: -50, w: 210, h: 24, seed: sd + 11 });
          [['odooPlum', -85], ['orange', -30], ['annMagenta', 30], ['teal', 85]].forEach(([c, x], i) => {
            C.tableLeg(ctx, { x, y0: -38, y1: 60, w: 20, fill: P[c], seed: sd + 12 + i });
          });
        },
        () => {
          C.person(ctx, { x: -42, y: 30, s: 0.34, shirt: P.teal, seed: sd + 20 });
          C.person(ctx, { x: 42, y: 36, s: 0.34, shirt: P.ochre, hair: P.wood, seed: sd + 21 });
        },
      ];

      ROWS.forEach((r, i) => {
        if (tt < r.at) return;
        const pop = E.outBack(L.clamp((tt - r.at) / 0.17));
        ctx.save();
        ctx.translate(IX, r.y - 10);
        ctx.scale(pop, pop);
        icons[i]();
        ctx.restore();
        const a = L.clamp((tt - r.at) / 0.25);
        L.text(ctx, r.main, TX, r.y - 8, { size: 56, weight: 800, color: P.ink, alpha: a });
        L.text(ctx, r.sub, TX, r.y + 48, { size: 40, weight: 600, color: P.inkSoft, alpha: a });
        if (i < ROWS.length - 1) L.inkPath(ctx, [[TX, r.y + 92], [1640, r.y + 92]], { width: 2, color: P.paperShade, alpha: a, seed: sd + 30 + i });
      });

      C.caption(ctx, 'Pausá el video y sacale una foto', L.clamp((t - 2.0) / 0.25));
    },
  });
})();
